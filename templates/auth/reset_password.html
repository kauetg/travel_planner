{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow p-4" style="max-width: 380px; width: 100%; border-radius: 1.25rem;">
    <h2 class="text-center mb-4">Redefinir senha</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nova senha</label>
        <input type="password" name="password" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Repita a senha</label>
        <input type="password" name="confirm" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
    </form>
  </div>
</div>
{% endblock %}
