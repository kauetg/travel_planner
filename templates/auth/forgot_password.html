{% extends "base.html" %}
{% block title %}Esqueci minha senha{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow p-4" style="max-width: 380px; width: 100%; border-radius: 1.25rem;">
    <h2 class="text-center mb-4">Esqueci minha senha</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Código de acesso</label>
        <input type="password" name="code" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Continuar</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}">Voltar para o login</a>
    </div>
  </div>
</div>
{% endblock %}
